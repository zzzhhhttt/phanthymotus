mcp_port: 15720

plugins:
  asr:
    enabled: false
    asr_model: paraformer-zh-en   # paraformer-zh-en | zipformer-en | sensevoice-small
    model_dir: /models/sherpa-onnx/asr
    hw_provider: cpu
    num_threads: 2
    language: zh-CN
    vad:
      model: sherpa_onnx    # sherpa_onnx (ONNX, lightweight) | silero (PyTorch) | webrtc
      threshold: 0.5
      silence_ms: 400
    kws:
      enabled: false
      model_dir: /models/sherpa-onnx/kws
      keywords:
        - "x iǎo f àn x iǎo f àn @小范小范"

  tts:
    enabled: false
    model_dir: /models/sherpa-onnx/tts
    speaker_id: 0
    speed: 1.0

  htmsg:
    enabled: false
    namespace: "robot1"   # 固定值，避免 fallback 到容器 hostname（可能是十六进制、以数字开头，ROS2 话题名不允许）
    keyframe:
      dist_thresh: 1.0    # meters — insert keyframe when moved this far
      angle_thresh: 0.35  # radians (~20°) — or rotated this much
    semantic:
      model: "mobileclip"
      sam_model: "sam2_tiny"
      confidence_decay: 0.95
    graph:
      db_path: "/opt/phanthy-motus/data/htmsg"
      max_nodes: 500

  vop:
    enabled: false
    namespace: "robot1"   # 同上，固定值避免同样的话题名报错
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []         # empty = default broad set
    fps: 5

  ocr:
    enabled: true
    provider: ppocr    # openai | qwen | tesseract | google | ppocr
    language: "zh"     # default language hint
    det_model: PP-OCRv6_tiny_det   # 换成 tiny 系列，v5_mobile det+rec 合计约21MB，超过15MB上限
    rec_model: PP-OCRv6_tiny_rec
    model_dir: /opt/models/ppocr   # populated at image build time from JuiceFS, not committed to git
    engine: onnxruntime            # onnxruntime | paddle
    device: cpu                    # gpu | cpu — 装的是 CPU 版 onnxruntime，且模型够小，CPU 跑也在预算内
    max_side: 1100                  # 推理前图片长边超过这个像素数就先缩小，省内存/加速；
                                    # 参考同事已跑通的配置调低（原1024，可以再调大权衡准确率）
    use_textline_orientation: true # 先判断文字方向、歪了就转正再识别，评测图片
                                    # 里不少是拍摄角度倾斜的（发票/菜单/货架标签），
                                    # 打开这个对识别准确率可能有帮助，开销不大