mcp_port: 15720

plugins:
  asr:
    enabled: false 
    asr_model: paraformer-zh-en   # paraformer-zh-en | zipformer-en | sensevoice-small
    model_dir: /models/sherpa-onnx/asr
    hw_provider: cpu
    num_threads: 2
    language: zh-CN
    vad:
      model: sherpa_onnx    # sherpa_onnx (ONNX, lightweight) | silero (PyTorch) | webrtc
      threshold: 0.5
      silence_ms: 400
    kws:
      enabled: false 
      model_dir: /models/sherpa-onnx/kws
      keywords:
        - "x iǎo f àn x iǎo f àn @小范小范"

  tts:
    enabled: false 
    model_dir: /models/sherpa-onnx/tts
    speaker_id: 0
    speed: 1.0

  htmsg:
    enabled: false 
    namespace: "robot1"   # 固定值，避免 fallback 到容器 hostname（可能是十六进制、以数字开头，ROS2 话题名不允许）
    keyframe:
      dist_thresh: 1.0    # meters — insert keyframe when moved this far
      angle_thresh: 0.35  # radians (~20°) — or rotated this much
    semantic:
      model: "mobileclip"
      sam_model: "sam2_tiny"
      confidence_decay: 0.95
    graph:
      db_path: "/opt/phanthy-motus/data/htmsg"
      max_nodes: 500

  vop:
    enabled: false 
    namespace: "robot1"   # 同上，固定值避免同样的话题名报错
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []         # empty = default broad set
    fps: 5

  ocr:
    enabled: true
    provider: ppocr    # openai | qwen | tesseract | google | ppocr
    language: "zh"     # default language hint
    det_model: PP-OCRv6_small_det  # 榜单规则改成单文件<10M后换成small（实测9.5MB），
                                    # rec 继续用 tiny（small rec 实测21MB，超标，换不了）
    rec_model: PP-OCRv6_tiny_rec
    model_dir: /opt/models/ppocr   # populated at image build time from JuiceFS, not committed to git
    engine: onnxruntime            # onnxruntime | paddle
    device: cpu                    # gpu | cpu — 装的是 CPU 版 onnxruntime，且模型够小，CPU 跑也在预算内
    max_side: 960                  # 推理前图片长边超过这个像素数就先缩小，省内存/加速；
                                    # 参考同事已跑通的配置调低（原1024，可以再调大权衡准确率）
    use_textline_orientation: false # 实测打开后分数反而下降了（评测图片大多本来
                                    # 就是端正的，方向判断偶尔误判、反而把原本清晰
                                    # 的图转歪了），保持关闭
    enhance_contrast: false        # 推理前做一次局部对比度增强（CLAHE），只是
                                    # 增强已有对比度，不是反色/二值化那种非此即彼
                                    # 的转换，几乎不增加内存；实测后关闭
    sharpen: true                   # 轻量锐化（3x3卷积），突出文字笔画边缘，对
                                    # 小字体/略模糊图片可能有帮助，同样不增加内存，
                                    # 单独测试，没跟别的改动混在一起
    unclip_ratio: 2.0                # 检测框往外扩张的比例，默认值；实测调到2.5
                                    # 分数下降，已改回2.0
    two_stage_recognition: false    # 先在缩小图上检测拿到粗略框位置，再从原图
                                    # （未缩小）裁剪+重新识别——之前用了一个没验证过
                                    # 的独立接口实测分数暴跌，已重写成复用验证过的
                                    # self._ocr.predict()，但还没有实际测过新版本，
                                    # 先保持关闭，确认单独测试再打开
    recrop_padding: 18               # two_stage_recognition 开启时，裁剪每个文字框
                                    # 四周多留出的像素余量，避免裁到文字边缘
    tiled_recognition: true        # 跟 two_stage_recognition 是两套独立策略，不要
                                    # 同时开——把原图机械切成有重叠的固定小块，逐块
                                    # 串行识别，内存/显存峰值锁定在"一块"的大小，
                                    # 不管原图多大都不会暴涨；代价是计算量比两阶段
                                    # 大很多（每一块不管有没有文字都要处理），耗时
                                    # 明显更长。用户要求先测试效果，暂不考虑耗时
    tile_size: 960                   # 每块的边长
    tile_overlap_ratio: 0.25         # 相邻块之间的重叠比例，避免文字被切割线切断
    tile_nms_iou_thresh: 0.5         # 判断两个框是不是"同一段文字被重复检测"的
                                    # 重合度阈值，用于合并相邻块重叠区域的重复结果
    tile_pre_downscale_max_side: 1400  # 切块之前，先把原图整体降到这个像素上限
                                    # （比正常路径的960宽松很多），避免直接摊开
                                    # 原始分辨率的巨图导致OOM，同时依然比960清晰
                                    # 得多，保留切块方案本身的效果